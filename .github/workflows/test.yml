name: CI build

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: 
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y libblas-dev liblapack-dev cmake

    - name: Install macOS dependencies
      if: matrix.os == 'macos-latest'
      run: brew install libomp cmake

    - name: Set macOS config
      if: matrix.os == 'macos-latest'
      run: |
        echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

    - run: |
        cmake -S . -B build \
          -DCMAKE_INSTALL_PREFIX=$(pwd)/install \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_INSTALL_RPATH="@loader_path/../lib" \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DNGT_BFLOAT_DISABLED=ON

    - run: cmake --build build

    - run: cmake --install build

    - run: install/bin/ngt -d 128 -o c create index data/sift-dataset-5k.tsv