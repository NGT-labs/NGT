name: CI build

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: 
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y libblas-dev liblapack-dev cmake

    - name: Install macOS dependencies
      if: matrix.os == 'macos-latest'
      run: brew install libomp cmake

    - name: Set macOS config
      if: matrix.os == 'macos-latest'
      run: |
        echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

    - name: Configure CMake
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          RPATH='$ORIGIN/../lib'
        else
        
          RPATH='@loader_path/../lib'
        fi
        cmake -S . -B build \
          -DCMAKE_INSTALL_PREFIX=$(pwd)/install \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_INSTALL_RPATH="$RPATH" \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DNGT_BFLOAT_DISABLED=ON

    - run: cmake --build build

    - run: cmake --install build

    - run: install/bin/ngt -d 128 -o c create index data/sift-dataset-5k.tsv

    - name: Check the number of appended objects
      run: |
        set -euo pipefail
        ngt=install/bin/ngt
        dir=build/append-test
        mkdir -p $dir
        seq 1 10 | awk '{print $1, 0, 0, 0}' > $dir/ten.tsv
        printf '1 0 0 0\n2 0 0 0\n3 0 0 0' > $dir/no-newline.tsv
        # check <index> <create flags> <append flags> <data> <expected number of objects>
        check() {
          $ngt create -d 4 $2 $dir/$1
          $ngt append $3 $dir/$1 $dir/$4
          actual=$($ngt info $dir/$1 2>&1 | sed -nE 's/^The number of the objects:[[:space:]]+//p')
          echo "$1: $actual objects (expected $5)"
          test "$actual" -eq "$5"
        }
        check limit-text   ""     "-n 5"      ten.tsv        5
        check limit-memory ""     "-m m -n 5" ten.tsv        5
        check limit-ip     "-D i" "-n 5"      ten.tsv        5
        check last-text    ""     ""          no-newline.tsv 3
        check last-memory  ""     "-m m"      no-newline.tsv 3
        check last-ip      "-D i" ""          no-newline.tsv 3

    - name: Build and test Python bindings
      env:
        NGT_STATIC_LIBRARY_PATH: ${{ github.workspace }}/build/lib/NGT/libngt.a
        NGT_INCLUDE_DIR: ${{ github.workspace }}/install/include
      run: |
        python3 -m venv build/python-venv
        # Match the native target used by the library build.
        build/python-venv/bin/python -m pip install ./python --config-settings=--build-option=--static-library-native
        # Run the self-contained Python regression tests.
        build/python-venv/bin/python -m unittest discover -s python/tests -p 'test_threaded_search.py' -v
        build/python-venv/bin/python -m unittest discover -s python/tests -p 'test_ngtpy.py' -v

    - name: Copy indexes in a path with spaces
      run: |
        set -euo pipefail
        ngt=install/bin/ngt
        dir="build/dir with space"
        mkdir -p "$dir"
        head -n 1000 data/sift-dataset-5k.tsv > "$dir/sift-1k.tsv"
        $ngt create -d 128 "$dir/anng" "$dir/sift-1k.tsv"
        # GraphOptimizer and repair used to copy the index with system("cp -r ..."),
        # which split these paths at the spaces.
        $ngt reconstruct-graph -m s -s n -o 10 -i 20 "$dir/anng" "$dir/onng"
        $ngt search -n 3 "$dir/onng" data/sift-query-3.tsv > "$dir/search.txt"
        test "$(grep -c 'Query No.' "$dir/search.txt")" -eq 3
        $ngt repair -m r "$dir/anng"
        test -f "$dir/anng.repair/grp"
        build/python-venv/bin/python - "$dir" <<'EOF'
        import sys
        import ngtpy
        path = sys.argv[1]
        optimizer = ngtpy.Optimizer(num_of_outgoings=10, num_of_incomings=20, log_disabled=True)
        optimizer.set_processing_modes(False, False, False, False)
        optimizer.execute(path + "/anng", path + "/onng-python")
        assert len(ngtpy.Index(path + "/onng-python").search([0.0] * 128, 3)) == 3
        EOF

  linux-core-openmp-disabled:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install build dependencies
      run: sudo apt-get install -y cmake

    - name: Configure core without OpenMP
      run: >-
        cmake -S . -B build-core-no-openmp
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DNGT_OPENMP_DISABLED=ON
        -DNGT_QBG_DISABLED=ON
        -DNGT_BFLOAT_DISABLED=ON

    - name: Build core without OpenMP
      run: |
        set -euo pipefail
        if grep -q -- '-fopenmp' build-core-no-openmp/compile_commands.json; then
          echo "OpenMP compilation is unexpectedly enabled."
          exit 1
        fi
        cmake --build build-core-no-openmp --parallel 2

  windows-build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        openmp_disabled: ['OFF', 'ON']
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up MinGW
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-libgomp
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja

    - name: Configure CMake
      run: >-
        cmake -S . -B build-windows -G Ninja
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DNGT_QBG_DISABLED=ON
        -DNGT_OPENMP_DISABLED=${{ matrix.openmp_disabled }}
        -DNGT_BFLOAT_DISABLED=ON
        -DNGT_MARCH_NATIVE_DISABLED=ON

    - name: Build
      run: cmake --build build-windows --parallel 2

    - name: Check version generation without Git metadata
      run: |
        set -euo pipefail
        smoke_dir=$(mktemp -d)
        archive="$smoke_dir/source archive"
        header="$smoke_dir/output directory/version_defs.h"
        mkdir -p "$archive"
        cp VERSION "$archive/VERSION"
        actual_git=$(sed -n 's/^GIT_EXECUTABLE:FILEPATH=//p' build-windows/CMakeCache.txt)
        test -n "$actual_git"
        for git_executable in '' 'GIT_EXECUTABLE-NOTFOUND' "$smoke_dir/missing git.exe" "$actual_git"; do
          cmake "-DGIT_EXECUTABLE=$git_executable" "-DNGT_SOURCE_DIR=$archive" \
            "-DNGT_VERSION_DEFS=$header" -P utils/mk_version_defs_h.cmake
          version=$(sed -nE 's/^#define[[:space:]]+NGT_VERSION[[:space:]]+"([^"]*)".*$/\1/p' "$header")
          test "$version" = "$(cat VERSION)"
          grep -Eq '^#define[[:space:]]+NGT_BUILD_DATE[[:space:]]+"[^"]+"' "$header"
          if grep -Eq '^#define[[:space:]]+NGT_GIT_(HASH|DATE|TAG)' "$header"; then
            echo "Unavailable Git metadata was unexpectedly emitted."
            exit 1
          fi
        done
        # A repository without tags still supplies its hash and commit date.
        git -C "$archive" init -q
        git -C "$archive" -c user.name=ci -c user.email=ci@example.com \
          commit --allow-empty -qm "test repository without tags"
        cmake "-DGIT_EXECUTABLE=$actual_git" "-DNGT_SOURCE_DIR=$archive" \
          "-DNGT_VERSION_DEFS=$header" -P utils/mk_version_defs_h.cmake
        hash=$(sed -nE 's/^#define[[:space:]]+NGT_GIT_HASH[[:space:]]+"([^"]*)".*$/\1/p' "$header")
        test -n "$hash"
        test "$hash" = "$(git -C "$archive" rev-parse HEAD)"
        grep -Eq '^#define[[:space:]]+NGT_GIT_DATE[[:space:]]+"[^"]+"' "$header"
        if grep -Eq '^#define[[:space:]]+NGT_GIT_TAG' "$header"; then
          echo "A Git tag was unexpectedly emitted for an untagged repository."
          exit 1
        fi

    - name: Check build-time version metadata refresh
      run: |
        set -euo pipefail
        header=build-windows/lib/NGT/version_defs.h
        read_macro() {
          sed -nE "s/^#define[[:space:]]+$1[[:space:]]+\"([^\"]*)\".*$/\1/p" "$header"
        }
        first_head=$(git rev-parse HEAD)
        first_hash=$(read_macro NGT_GIT_HASH)
        first_date=$(read_macro NGT_BUILD_DATE)
        test -n "$first_head"
        test -n "$first_hash"
        test -n "$first_date"
        test "$first_hash" = "$first_head"
        printf 'First hash: %s\nFirst build date: %s\n' "$first_hash" "$first_date"
        sleep 2
        git -c user.name=ci -c user.email=ci@example.com \
          commit --allow-empty -m "test version metadata refresh"
        second_head=$(git rev-parse HEAD)
        test -n "$second_head"
        test "$second_head" != "$first_head"
        cmake --build build-windows --parallel 2 --verbose 2>&1 | tee build-windows/version-refresh-build.log
        second_hash=$(read_macro NGT_GIT_HASH)
        second_date=$(read_macro NGT_BUILD_DATE)
        test -n "$second_hash"
        test -n "$second_date"
        test "$second_hash" = "$second_head"
        test "$second_hash" != "$first_hash"
        test "$second_date" != "$first_date"
        printf 'Second hash: %s\nSecond build date: %s\n' "$second_hash" "$second_date"
        if grep -Ei 'Re-running CMake|-- Configuring done|-- Generating done' build-windows/version-refresh-build.log; then
          echo "Unexpected CMake reconfiguration during metadata refresh."
          exit 1
        fi
        grep -E ' -c .*Version[.]cpp' build-windows/version-refresh-build.log
        grep -E ' -c .*ngt[.]cpp' build-windows/version-refresh-build.log
        grep -E ' -o .*ngt[.]exe' build-windows/version-refresh-build.log

    - name: Create and search SIFT index
      run: |
        set -e
        ./build-windows/bin/ngt/ngt.exe create -d 128 -o c build-windows/sift-index data/sift-dataset-5k.tsv
        # Unix readers require LF line endings in the property file.
        if LC_ALL=C grep -Uq $'\r' build-windows/sift-index/prf; then
          echo "The property file contains CRLF line endings."
          exit 1
        fi
        ./build-windows/bin/ngt/ngt.exe search -n 3 build-windows/sift-index data/sift-query-3.tsv > build-windows/search.txt
        test "$(grep -c 'Query No.' build-windows/search.txt)" -eq 3
        test "$(grep -Ec '^[123][[:space:]]+[0-9]+[[:space:]]+[0-9]+([.][0-9]+)?([eE][-+]?[0-9]+)?[[:space:]]*$' build-windows/search.txt)" -eq 9

    - name: Reconstruct graph with the default edge limit
      run: |
        set -euo pipefail
        ngt=./build-windows/bin/ngt/ngt.exe
        head -n 1000 data/sift-dataset-5k.tsv > build-windows/sift-1k.tsv
        $ngt create -d 128 -i g -E 10 build-windows/anng-1k build-windows/sift-1k.tsv
        # -A is omitted on purpose: its default must stay unbounded. When long is 32-bit,
        # INT64_MAX used to wrap to -1, so no reverse edges were added.
        $ngt reconstruct-graph -m s -s n -o 10 -i 20 build-windows/anng-1k build-windows/onng-1k
        stats=$($ngt info -m e build-windows/onng-1k 2>&1 | grep '^#-nodes')
        echo "$stats"
        test "$(echo "$stats" | cut -d: -f4)" -eq 0   # nodes without incoming edges
        test "$(echo "$stats" | cut -d: -f7)" -gt 10  # max outgoing edges exceeds -o
